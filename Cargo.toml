[package]
name = "bruecke"
version = "0.1.0"
edition = "2021"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
