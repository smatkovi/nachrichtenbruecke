# Ereignistyp fuer eine neue Nachricht aus der Bruecke.
#
# Gehoert nach /usr/share/meegotouch/notifications/eventtypes/.
#
# class=system ist das Entscheidende: nur solche Meldungen erscheinen als
# Banner ueber allem, auch am Sperrbildschirm. Eine gewoehnliche
# Anwendungsmeldung taucht bloss in der Uebersicht und in der oberen
# Leiste auf -- beim WhatsApp-Anruf war genau das im Feld zu sehen.
#
# Kein feedbackId: den Ton gibt es auf diesem Geraet schon von anderer
# Stelle, ein zweiter waere einer zu viel. Wer ihn hier haben moechte,
# traegt feedbackId=chat ein.
#
# Die Symbole sind die des Systems fuer Sofortnachrichten, damit die
# Meldung aussieht wie jede andere und nicht wie ein Fremdkoerper.
class=system
persistent=true
userRemovable=true
priority=60
iconId=icon-m-content-chat-inverse
previewIconId=icon-s-status-chat
statusAreaIconId=icon-s-status-notifier-chat
lowPowerModeIconId=icon-m-low-power-mode-chat
